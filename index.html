let AC=null,muted=false;
try{muted=localStorage.getItem('zs2_mute')==='1';}catch(e){}
function beep(freq,dur,type,vol,slide){
  if(!AC||muted)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
}

  pick:()=>{beep(520,0.1,'square',0.06);setTimeout(()=>beep(780,0.12,'square',0.06),80);},
  die:()=>beep(200,0.3,'triangle',0.08,45),door:()=>beep(240,0.22,'triangle',0.06,150),roar:()=>beep(75,0.7,'sawtooth',0.13,45),

/* ----- мультяшный стиль: плавные картинки, «ступенчатый» свет и чёрные контуры; цвета как в первой части ----- */
function canvasTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;
  if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);}
  return t;
}
const gradCanvas=document.createElement('canvas');gradCanvas.width=4;gradCanvas.height=1;
['#8a8a8a','#b4b4b4','#e6e6e6','#ffffff'].forEach((c,i)=>{const g=gradCanvas.getContext('2d');g.fillStyle=c;g.fillRect(i,0,1,1);});
const gradient=new THREE.CanvasTexture(gradCanvas);gradient.magFilter=gradient.minFilter=THREE.NearestFilter;gradient.generateMipmaps=false;
const lam=opt=>new THREE.MeshToonMaterial(Object.assign({gradientMap:gradient},opt));
const matCache={},texCache={};
const col=c=>matCache[c]||(matCache[c]=lam({color:c}));
/* школа строится из «мягких» материалов (softBuild), а враги и оружие остаются мультяшными с чёрным контуром */
let softBuild=false;const softCache={};
const soft=c=>softCache[c]||(softCache[c]=new THREE.MeshLambertMaterial({color:c}));
const softLine=new THREE.LineBasicMaterial({color:0x2a2030,transparent:true,opacity:0.3});
const asMat=m=>typeof m==='number'?(softBuild?soft(m):col(m)):m;
const INK=0x1e1e28;
const inkMat=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide});
const lineMat=new THREE.LineBasicMaterial({color:INK});
let target=scene;   // куда складывать новые предметы (при стройке этажа — в его комнату)
function add(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,asMat(mat));m.position.set(x,y,z);(parent||target).add(m);return m;}
function box(w,h,d,mat,x,y,z,parent){return add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,parent);}
function edged(m){m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),softBuild?softLine:lineMat));return m;}
function ball(r,mat,x,y,z,parent,ink){const m=add(new THREE.SphereGeometry(r,16,12),mat,x,y,z,parent);
  if(ink)m.add(new THREE.Mesh(new THREE.SphereGeometry(r+ink,16,12),inkMat));return m;}
function tube(r1,r2,h,mat,x,y,z,parent,ink){const m=add(new THREE.CylinderGeometry(r1,r2,h,14),mat,x,y,z,parent);
  if(ink)m.add(new THREE.Mesh(new THREE.CylinderGeometry(r1+ink,r2+ink,h+ink*2,14),inkMat));return m;}
function plane(w,h,mat,x,y,z,ry,parent){const m=add(new THREE.PlaneGeometry(w,h),mat,x,y,z,parent);m.rotation.y=ry||0;return m;}
const flat=opt=>new THREE.MeshBasicMaterial(opt);

/* ====================== ПЕРСОНАЖИ (мультяшные) ====================== */
/* Враги сделаны по картинкам первой части: большая голова с пиксельным лицом, те же цвета и силуэты,
   руки вытянуты вперёд, чёрный контур. Модель стоит ногами на полу (y=0) и смотрит вдоль +z. */
const geoCache={};
function roundGeo(w,h,d,r){   // коробка со скруглёнными углами
  r=Math.min(r,w/2,h/2,d/2);const key=[w,h,d,r].join();if(geoCache[key])return geoCache[key];
  const geo=new THREE.BoxGeometry(w,h,d,8,8,8),p=geo.attributes.position,n=geo.attributes.normal,v=new THREE.Vector3(),c=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    c.set(Math.max(-w/2+r,Math.min(w/2-r,v.x)),Math.max(-h/2+r,Math.min(h/2-r,v.y)),Math.max(-d/2+r,Math.min(d/2-r,v.z)));
    v.sub(c).normalize();n.setXYZ(i,v.x,v.y,v.z);v.multiplyScalar(r).add(c);p.setXYZ(i,v.x,v.y,v.z);}
  return geoCache[key]=geo;
}
function part(w,h,d,mat,x,y,z,parent,ink,r){
  const rad=r===undefined?Math.min(w,h,d)*0.24:r,m=add(roundGeo(w,h,d,rad),mat,x,y,z,parent);
  if(ink!==0){const k=ink||0.032;m.add(new THREE.Mesh(roundGeo(w+k*2,h+k*2,d+k*2,rad+k),inkMat));}
  return m;
}
/* Лица в высоком разрешении: плавные глаза с бликами, брови, рты с зубами. Рисуются на картинке 512 точек шириной.
   kind — чьё лицо, open — рот открыт (кусает). Глаза всех стоят на высоте EYE_Y — по ней же надеваются очки. */
const EYE_Y=0.4,EYE_X=0.28,LINE='#1e1e28';
const faceCache={};
function oval(g,x,y,rx,ry,fill,line){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill();
  if(line){g.lineWidth=line;g.strokeStyle=LINE;g.stroke();}}
function curve(g,x0,y0,cx,cy,x1,y1,w,color){g.beginPath();g.moveTo(x0,y0);g.quadraticCurveTo(cx,cy,x1,y1);g.lineWidth=w;g.lineCap='round';
  g.strokeStyle=color||LINE;g.stroke();}
function eye(g,x,y,rx,ry,white,iris,ir,look){oval(g,x,y,rx,ry,white,13);const px=x+(look||0);
  oval(g,px,y+ry*0.08,ir,ir,iris);if(iris!==LINE)oval(g,px,y+ry*0.08,ir*0.45,ir*0.45,LINE);
  oval(g,px-ir*0.35,y-ir*0.4,ir*0.34,ir*0.34,'#ffffff');
  curve(g,x-rx*0.9,y-ry*0.55,x,y-ry*1.12,x+rx*0.9,y-ry*0.55,10,'rgba(30,30,40,.35)');}
function mouth(g,x,y,w,h,top,bottom){   // открытый рот: тёмный внутри, язык и острые зубы
  const path=()=>{g.beginPath();g.moveTo(x-w/2,y);g.quadraticCurveTo(x,y-h*0.3,x+w/2,y);g.quadraticCurveTo(x+w*0.36,y+h*1.2,x,y+h*1.15);
    g.quadraticCurveTo(x-w*0.36,y+h*1.2,x-w/2,y);g.closePath();};
  path();g.fillStyle='#7a1024';g.fill();g.save();g.clip();oval(g,x,y+h*1.12,w*0.3,h*0.5,'#e65070');
  const row=(n,yy,dir,th)=>{for(let i=0;i<n;i++){const tw=w*0.86/n,tx=x-w*0.43+i*tw;g.beginPath();g.moveTo(tx+2,yy-dir*h*0.4);g.lineTo(tx+2,yy);
    g.lineTo(tx+tw/2,yy+dir*th);g.lineTo(tx+tw-2,yy);g.lineTo(tx+tw-2,yy-dir*h*0.4);g.closePath();g.fillStyle='#fffbe8';g.fill();
    g.lineWidth=5;g.strokeStyle=LINE;g.stroke();}};
  if(top)row(top,y+h*0.04,1,h*0.34);if(bottom)row(bottom,y+h*0.98,-1,h*0.28);g.restore();
  path();g.lineWidth=14;g.lineJoin='round';g.strokeStyle=LINE;g.stroke();}

  const day=today(),q=save.quests;

  let h=2166136261;for(const ch of day)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;
  const rand=()=>{h=Math.imul(h^(h>>>15),2246822519)>>>0;h=Math.imul(h^(h>>>13),3266489917)>>>0;h=(h^(h>>>16))>>>0;return h/4294967296;};
  const keys=Object.keys(QUESTS),items=TIERS.map(tier=>{const k=keys.splice(Math.floor(rand()*keys.length),1)[0];
    return {k,tier,goal:QUESTS[k].g[tier],p:k==='weapon'?QUEST_WEAPONS[Math.floor(rand()*QUEST_WEAPONS.length)]:null,n:0,done:false,seen:[]};});

      if(d-e.k.r>w.range||P.y>e.y+e.k.h||P.y+1.8<e.y)continue;

  for(let i=projectiles.length-1;i>=0;i--){

    const r=f&&f.call(on?document:d);if(r&&r.catch)r.catch(()=>{});}catch(e){}
}

/* ====================== КАДР ====================== */
function updatePlayer(dt){
  let fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y;
  let side=(keys.KeyD?1:0)-(keys.KeyA?1:0)+stick.x;
  if(keys.ArrowLeft)P.yaw+=2.6*dt;if(keys.ArrowRight)P.yaw-=2.6*dt;
  const l=Math.hypot(fwd,side);if(l>1){fwd/=l;side/=l;}
  const sp=((keys.ShiftLeft||keys.ShiftRight||(isTouch&&l>0.98))?6.8:4.4)*klass().speed;
  const f=forward(),r=[Math.cos(P.yaw),-Math.sin(P.yaw)];
  moveBy(P,(f[0]*fwd+r[0]*side)*sp*dt,(f[1]*fwd+r[1]*side)*sp*dt,0.35,P.y,0.35);
  for(const e of enemies){if(e.dead>0||e.flying||Math.abs(e.x-P.x)>2||P.y>e.y+e.k.h*0.8)continue;const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),m=e.k.r+0.28;
    if(d<m&&d>1e-4)moveBy(P,dx/d*(m-d)*0.7,dz/d*(m-d)*0.7,0.35,P.y,0.35);}
  checkStairs();
  const st=stairAt(P.x,P.z),g=st?stairY(st):groundAt(P.x,P.z,0.35,P.y,0.35);
  if(st&&P.vy<=0&&P.y>g&&P.y-g<0.45){P.y=g;P.vy=0;}   // вниз по ступенькам идём, а не падаем
  const onFloor=P.y<=g+0.02,jump=!!keys.Space;
  if(onFloor)S.airJumps=klass().double?1:0;
  if(jump&&onFloor){P.vy=6.4;quest('jump',1);}
  else if(jump&&!S.prevJump&&S.airJumps>0){S.airJumps--;P.vy=6;burst(P.x,P.y+0.2,P.z,0xcfe0ff,6);quest('jump',1);}
  S.prevJump=jump;
  P.vy-=17*dt;P.y+=P.vy*dt;if(P.y<=g){P.y=g;P.vy=0;}
  P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);P.swing=Math.max(0,P.swing-dt);
  if((attackHeld||keys.KeyJ)&&P.cd<=0)attack();
  if(l>0.05&&P.y<=g+0.02)P.bob+=dt*sp*2;
}
function updateCamera(){
  const sh=S.shake*0.18;
  camera.position.set(P.x+(Math.random()-0.5)*sh,P.y+1.58+Math.sin(P.bob)*0.035+(Math.random()-0.5)*sh,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  const sw=Math.sin(P.swing/0.22*Math.PI),portrait=camera.aspect<1;
  view.position.set((portrait?0.1:0.2)-sw*0.07,-0.17+Math.sin(P.bob)*0.006+sw*0.02,-0.33-sw*0.05);
  view.rotation.set(-sw*1.0,sw*0.45,0);view.scale.setScalar(0.5);
}
function bossHere(){const r=roomAt(P.x,P.z);
  return enemies.find(e=>(e.kind==='boss'||e.kind==='strict')&&e.dead<=0&&e.awake&&r===e.home)||null;}
const MAP_COLORS={stairs:'#96a8b4',support:'#78c878',korean:'#f0b45a',first:'#f082aa',office:'#d23c46',canteen:'#e1a046',cls:'#e1c88c',hall:'#aa82d2',
  teachers:'#64b4dc',english:'#e6a0be',strict:'#968ca0',pe:'#dc8c50',science:'#78d2c3'};
const MAP_MARK={stairs:'▲▼',support:'♥',korean:'한',first:'1',office:'★',canteen:'食',hall:'♪',teachers:'✎',english:'ABC',strict:'A!',pe:'체',science:'H₂O'};
function drawMap(){   // круглая мини-карта: ты в центре, куда смотришь — то вверху
  const c=$('map'),g=c.getContext('2d'),size=c.width,R=size/2,k=9,L=F.len;   // k — точек на метр
  const X=x=>(x-P.x)*k,Z=z=>(z-P.z)*k;
  const rect=(x0,x1,z0,z1,fill)=>{g.fillStyle=fill;g.fillRect(X(x0),Z(z0),(x1-x0)*k,(z1-z0)*k);};
  const line=(x0,z0,x1,z1,color,w)=>{g.strokeStyle=color||'#1e1e28';g.lineWidth=w||4;g.beginPath();g.moveTo(X(x0),Z(z0));g.lineTo(X(x1),Z(z1));g.stroke();};
  const dot=(x,z,r,fill)=>{g.fillStyle=fill;g.strokeStyle='#1e1e28';g.lineWidth=2;g.beginPath();g.arc(X(x),Z(z),r,0,7);g.fill();g.stroke();};
  g.clearRect(0,0,size,size);g.save();g.beginPath();g.arc(R,R,R-5,0,7);g.clip();
  g.fillStyle='#12162c';g.fillRect(0,0,size,size);
  g.translate(R,R);g.rotate(P.yaw);
  rect(-STAIR,L+STAIR,0,CORR,'#d2dce6');
  F.rooms.forEach(r=>rect(r.x0,r.x1,-DEPTH,0,r.type==='stairs'?'#d2dce6':MAP_COLORS[r.type]));
  // лестницы: полоски-ступеньки
  [[-STAIR,-SIDE.u0],[L+SIDE.u0,L+STAIR]].forEach(([a,b])=>{rect(a,b,0,CORR,'#8c96a8');for(let x=a;x<=b;x+=0.55)line(x,0,x,CORR,'#4a5468',2);});
  const ms=mainStair();rect(ms.x0,ms.x1,-DEPTH,-MAIN.u0,'#8c96a8');for(let z=-DEPTH;z<=-MAIN.u0;z+=0.65)line(ms.x0,z,ms.x1,z,'#4a5468',2);
  // стены
  line(-STAIR,CORR,L+STAIR,CORR);line(-STAIR,0,-STAIR,CORR);line(L+STAIR,0,L+STAIR,CORR);line(-STAIR,0,0,0);line(L,0,L+STAIR,0);
  F.rooms.forEach(r=>{line(r.x0,-DEPTH,r.x1,-DEPTH);line(r.x0,-DEPTH,r.x0,0);line(r.x1,-DEPTH,r.x1,0);
    if(r.type!=='stairs'){const a=r.x0+1.9,b=r.x1-1.9,h=DOOR_W/2;line(r.x0,0,a-h,0);line(a+h,0,b-h,0);line(b+h,0,r.x1,0);}});
  // двери: коричневая закрыта, зелёная открыта, красная заперта
  F.doors.forEach(d=>{if(passable(d)){const o=d.x+d.dir*DOOR_W;line(o-DOOR_W/2,0.25,o+DOOR_W/2,0.25,'#46c85a',5);}
    else line(d.x-DOOR_W/2,0,d.x+DOOR_W/2,0,(d.locked&&!S.hasKey)?'#e6283c':'#965f32',6);});
  // подписи помещений (всегда ровные)
  F.rooms.forEach(r=>{g.save();g.translate(X(r.x0+r.w/2),Z(r.type==='stairs'?-6.2:-DEPTH/2));g.rotate(-P.yaw);
    textFit(g,r.type==='cls'?r.id:MAP_MARK[r.type],0,0,70,22,'#1e1e28');g.restore();});
  F.pickups.forEach(q=>{if(q.wait>0)return;if(q.kind==='key')dot(q.x,q.z,8,'#fadc3c');else dot(q.x,q.z,3.5,q.kind==='pie'?'#ff96aa':'#ffffff');});
  F.enemies.forEach(e=>{if(e.dead<=0)dot(e.x,e.z,Math.max(4.5,e.k.r*k*0.75),e.kind==='boss'||e.kind==='strict'?'#a032c8':'#e6283c');});
  g.restore();
  // куда идти: золотая стрелка на краю карты (ключ или кабинет директора на этом этаже)
  const key=F.pickups.find(q=>q.kind==='key'),office=F.rooms.find(r=>r.type==='office');
  const goal=key?[key.x,key.z]:(S.hasKey&&office?[office.x0+1.9,0]:null);
  if(goal){const dx=goal[0]-P.x,dz=goal[1]-P.z;
    if(Math.hypot(dx,dz)*k>R-20){const a=Math.atan2(dx*Math.sin(P.yaw)+dz*Math.cos(P.yaw),dx*Math.cos(P.yaw)-dz*Math.sin(P.yaw));
      g.save();g.translate(R+Math.cos(a)*(R-18),R+Math.sin(a)*(R-18));g.rotate(a);g.fillStyle='#fadc3c';g.strokeStyle='#1e1e28';g.lineWidth=3;
      g.beginPath();g.moveTo(14,0);g.lineTo(-7,10);g.lineTo(-7,-10);g.closePath();g.fill();g.stroke();g.restore();}}
  // ты
  g.fillStyle='#2878ff';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(R,R-14);g.lineTo(R+10,R+10);g.lineTo(R,R+5);g.lineTo(R-10,R+10);g.closePath();g.fill();g.stroke();
  // рамка
  g.lineWidth=8;g.strokeStyle='#1e1e28';g.beginPath();g.arc(R,R,R-5,0,7);g.stroke();
  g.lineWidth=2.5;g.strokeStyle='#ffe178';g.beginPath();g.arc(R,R,R-5,0,7);g.stroke();
}
function hud(dt){
  $('hearts').innerHTML='<span style="color:#e63c50">'+'♥'.repeat(Math.max(0,P.hp))+'</span><span style="color:#5a5a64">'+'♥'.repeat(Math.max(0,P.max-P.hp))+'</span>';
  const w=WEAPONS[P.weapon],label=(P.weapon==='fists'&&klass().kick)?'kickName':P.weapon;
  $('weapon').textContent=tr(label)+(w.ammo?'  x'+(P.ammo[P.weapon]||0):'')+(S.hasKey?'  🔑':'')+'  ◉'+save.coins;
  const r=roomAt(P.x,P.z);
  $('place').textContent=tr('floor',F.n)+' · '+(r?roomName(r):tr((P.x<0||P.x>F.len||P.z<-0.3)?'stairs':'corridor'));
  const boss=bossHere();
  $('goal').textContent=tr((r&&r.type==='office')?'goalBoss':(S.hasKey?'goalOffice':'goalKey'));
  $('boss').classList.toggle('hide',!boss);
  if(boss){$('bossfill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';$('bossname').textContent=tr(boss.kind==='boss'?'bossName':'strictName');}
  const d=nearDoor();
  $('hint').textContent=d?tr(d.locked&&!S.hasKey?'lockedHint':(d.open?'closeHint':'openHint')):'';
  $('tDoor').classList.toggle('hide',!d);
  if(S.msgT>0){S.msgT-=dt;if(S.msgT<=0)$('msg').textContent='';}
  if(S.toastT>0){S.toastT-=dt;if(S.toastT<=0)$('toast').textContent='';}
  S.mapT-=dt;if(S.mapT<=0){S.mapT=0.033;drawMap();}
}
function update(dt){
  if(S.state!=='play')return;
  S.time+=dt;
  updateDoors(dt);updatePlayer(dt);
  const r=roomAt(P.x,P.z);
  if(r!==S.lastRoom){S.lastRoom=r;if(r&&r.safe)say('safe');if(r&&r.id==='5-1')say('npc','',4.5);}
  for(const e of [...enemies]){if(Math.abs(e.x-P.x)<34||e.dead>0)updateEnemy(e,dt);if(S.state!=='play')return;}
  updateProjectiles(dt);if(S.state!=='play')return;
  updatePickups(dt);updateParticles(dt);
  if(S.won){S.winT-=dt;if(S.winT<=0){S.state='win';earn(100);show('win');unlock();}}
}
function render(dt){
  S.shake=Math.max(0,S.shake-dt);P.hurt=Math.max(0,P.hurt-dt);
  const inMenu=S.state==='menu';
  menuWorld.visible=inMenu;floors.forEach(f=>{if(f)f.group.visible=!inMenu;});
  scene.background=inMenu?menuSky:gameSky;scene.fog.color.setHex(inMenu?0x241a40:0x2a2040);scene.fog.near=inMenu?30:28;scene.fog.far=inMenu?85:60;
  if(inMenu)updateMenu(dt);
  else{updateCamera();hud(dt);$('hurt').style.opacity=Math.min(1,P.hurt*1.8);}
  view.visible=S.state!=='menu';
  if(S.fade>0)S.fade=Math.max(0,S.fade-dt*1.4);
  $('fade').style.opacity=Math.min(1,S.fade*1.5);
  alignFloors();
  const eye=camera.position.x,close=Math.abs(P.x-anchor(F,nearStair()))<10;
  floors.forEach(f=>{if(f&&Math.abs(f.n-F.n)<=1)cullFloor(f,f===F?30:close?16:0,eye-f.group.position.x);});
  updateLights(!inMenu);
  renderer.render(scene,camera);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);render(dt);requestAnimationFrame(loop);
}
buildMenu();dressHero();goFloor(1);applyLang();setWeapon('fists');show('menu');requestAnimationFrame(loop);
// для проверки из консоли (и автоматических тестов)
window.ZS={S,P,PLAN,WEAPONS,KINDS,keys,camera,renderer,scene,floors,get floor(){return F;},get enemies(){return enemies;},
  startGame,retry,update,render,attack,spawnEnemy,quest,ensureQuests,save,CLASSES,SKINS,shopOpen,pickItem,useDoor,setWeapon,nextWeapon,damage,hurtPlayer,changeFloor,goFloor,pause,resume,toMenu,
  setLang:l=>{lang=l;applyLang();},T};

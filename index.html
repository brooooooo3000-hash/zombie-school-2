}

function updateStreet(dt){
  const f=F;f.time+=dt;f.sky.position.set(P.x,0,P.z);f.sky.visible=P.z<20;const c=f.time%18,carsGo=c<9,walkGo=c>=10.5&&c<17;

  const blink=walkGo&&c>15&&Math.floor(c*4)%2===0;

      p.g.position.set(p.a[0]+dx*p.t,0,p.a[1]+dz*p.t);p.g.rotation.y=Math.atan2(dx,dz)+(p.back?Math.PI:0);}

/* ----- лестницы настоящие: по ним поднимаются ногами -----
   u — расстояние от этажа вглубь лестницы, v — вбок от середины (v<0 — половина «вверх», v>0 — «вниз»).
   T(u,v) переводит это в [x,z]. Каждый этаж строит только свой подъём: пролёт слева до площадки на половине высоты
   и пролёт справа от площадки до следующего этажа. Соседние этажи стоят сверху и снизу, поэтому лестница цельная. */
function stairBox(T,u0,u1,v0,v1,y0,y1,mat){const a=T(u0,v0),b=T(u1,v1);
  return box(Math.abs(b[0]-a[0]),y1-y0,Math.abs(b[1]-a[1]),mat,(a[0]+b[0])/2,(y0+y1)/2,(a[1]+b[1])/2);}
function stairSolid(T,u0,u1,v0,v1){const a=T(u0,v0),b=T(u1,v1);
  solid(Math.min(a[0],b[0]),Math.max(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[1],b[1]),9);}
function rail(T,ua,ya,ub,yb,v){const a=T(ua,v),b=T(ub,v),len=Math.hypot(ub-ua,yb-ya);   // перила под наклоном
  box(0.09,0.09,len,0x8a5a3c,(a[0]+b[0])/2,(ya+yb)/2,(a[1]+b[1])/2).lookAt(b[0],yb,b[1]);}
function fence(T,ua,va,ub,vb){const n=Math.max(1,Math.round(Math.hypot(ub-ua,vb-va)/0.55));   // перила: столбики и деревянный поручень
  for(let i=0;i<=n;i++){const q=T(ua+(ub-ua)*i/n,va+(vb-va)*i/n);box(0.06,1,0.06,0x3c60aa,q[0],0.5,q[1]);}
  const a=T(ua,va),b=T(ub,vb);box(Math.abs(b[0]-a[0])+0.1,0.08,Math.abs(b[1]-a[1])+0.1,0x8a5a3c,(a[0]+b[0])/2,1.03,(a[1]+b[1])/2);}
function stairwell(f,id,T,s,W,ry,signU){
  const outer=target,well=new THREE.Group();outer.add(well);f.wells[id]=well;target=well;
  const n=f.n,up=n<PLAN.length,down=n>1,half=LEVEL/2,N=10,d=(s.u1-s.u0)/N,wc=WALLS.stairs;
  if(up){
    for(let i=0;i<N;i++){const h=half*(i+1)/N;
      let a=s.u0+i*d;   // левый пролёт: от этажа вглубь и вверх
      edged(stairBox(T,a,a+d,-W,-0.08,Math.max(0,h-0.4),h,0xbec3cd));stairBox(T,a,a+0.07,-W,-0.08,h,h+0.012,0x6e7486);
      a=s.u1-(i+1)*d;   // правый пролёт: от площадки обратно, до следующего этажа
      edged(stairBox(T,a,a+d,0.08,W,half+h-0.4,half+h,0xbec3cd));stairBox(T,a+d-0.07,a+d,0.08,W,half+h,half+h+0.012,0x6e7486);}
    edged(stairBox(T,s.u1,s.back,-W,W,half-0.25,half,0xaab0bc));   // площадка
    edged(stairBox(T,s.u0,s.u1,-0.08,0.08,0,LEVEL,wallMat(wc,s.u1-s.u0)));   // стенка между пролётами
    rail(T,s.u0,0.95,s.u1,half+0.95,-0.17);rail(T,s.u1,half+0.95,s.u0,LEVEL+0.95,0.17);
  }else{   // самый верх: выше некуда, только перила
    fence(T,s.u0,0,s.u1,0);fence(T,s.u0-0.06,-W+0.1,s.u0-0.06,0);stairSolid(T,s.u0-0.12,s.u0,-W,0);
  }
  stairSolid(T,s.u0,s.u1,-0.08,0.08);
  if(!down){edged(stairBox(T,s.u0-0.12,s.u0,0.08,W,0,LEVEL-0.42,wallMat(wc,W)));stairSolid(T,s.u0-0.12,s.u0,0,W);}   // на 1 этаже вниз некуда: стенка под лестницей
  // перекрытие между этажами по краям клетки и высокие невидимые границы
  [-1,1].forEach(k=>{stairBox(T,s.u0-0.15,s.back,k*(W-s.wi),k*(W+s.wo),ROOM_H,LEVEL-0.004,0xefe4cc);stairSolid(T,s.u0,s.back+s.bo,k*(W-s.wi),k*(W+0.2));});
  stairBox(T,s.back,s.back+s.bo,-W,W,ROOM_H,LEVEL-0.004,0xefe4cc);stairSolid(T,s.back,s.back+s.bo,-W,W);
  stairBox(T,s.u0-0.15,s.u0,-W,W,ROOM_H,LEVEL-0.03,0xefe4cc);
  // крышки клетки: видны только на самом краю (нижний этаж, верхний этаж или крайний из видимых)

  let h=2166136261;for(const ch of day)h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;

  const keys=Object.keys(QUESTS),items=TIERS.map(tier=>{const k=keys.splice(Math.floor(rand()*keys.length),1)[0];

  const lend=e=>{for(const t of e.changedTouches)if(t.identifier===lid)lid=null;};
  canvas.addEventListener('touchend',lend);canvas.addEventListener('touchcancel',lend);
  const hold=(el,on,off)=>{el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
    ['touchend','touchcancel'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();if(off)off();},{passive:false}));};
  hold($('tHit'),()=>{attackHeld=true;attack();},()=>{attackHeld=false;});
  hold($('tJump'),()=>{keys.Space=true;},()=>{keys.Space=false;});
  hold($('tSwap'),()=>nextWeapon());
  hold($('tDoor'),()=>useDoor());
  hold($('tPause'),()=>pause());
}

  if(kind==='help'){$('subList').innerHTML=tr(isTouch?'helpTouch':'helpPC').split('|').map(s=>'<li>'+s+'</li>').join('');return;}

/* ====================== КАДР ====================== */
function updatePlayer(dt){
  let fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y;
  let side=(keys.KeyD?1:0)-(keys.KeyA?1:0)+stick.x;
  if(keys.ArrowLeft)P.yaw+=2.6*dt;if(keys.ArrowRight)P.yaw-=2.6*dt;
  const l=Math.hypot(fwd,side);if(l>1){fwd/=l;side/=l;}
  const sp=((keys.ShiftLeft||keys.ShiftRight||(isTouch&&l>0.98))?6.8:4.4)*klass().speed;
  const f=forward(),r=[Math.cos(P.yaw),-Math.sin(P.yaw)];
  moveBy(P,(f[0]*fwd+r[0]*side)*sp*dt,(f[1]*fwd+r[1]*side)*sp*dt,0.35,P.y,0.35);
  for(const e of enemies){if(e.dead>0||e.flying||Math.abs(e.x-P.x)>2||P.y>e.y+e.k.h*0.8)continue;const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),m=e.k.r+0.28;
    if(d<m&&d>1e-4)moveBy(P,dx/d*(m-d)*0.7,dz/d*(m-d)*0.7,0.35,P.y,0.35);}
  checkStairs();
  const st=stairAt(P.x,P.z),g=st?stairY(st):groundAt(P.x,P.z,0.35,P.y,0.35);
  if(st&&P.vy<=0&&P.y>g&&P.y-g<0.45){P.y=g;P.vy=0;}   // вниз по ступенькам идём, а не падаем
  const onFloor=P.y<=g+0.02,jump=!!keys.Space;
  if(onFloor)S.airJumps=klass().double?1:0;
  if(jump&&onFloor){P.vy=6.4;quest('jump',1);}
  else if(jump&&!S.prevJump&&S.airJumps>0){S.airJumps--;P.vy=6;burst(P.x,P.y+0.2,P.z,0xcfe0ff,6);quest('jump',1);}
  S.prevJump=jump;
  P.vy-=17*dt;P.y+=P.vy*dt;if(P.y<=g){P.y=g;P.vy=0;}
  const roof=F.home?(P.x<0?2.75:(P.z>9||P.x<DOOR_X+0.3)?3:99):floorY(P.x,P.z)+ROOM_H;   // головой в потолок: камера не вылезает наружу
  if(P.y+1.78>roof){P.y=Math.max(g,roof-1.78);P.vy=Math.min(P.vy,0);}
  P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);P.swing=Math.max(0,P.swing-dt);
  if((attackHeld||keys.KeyJ)&&P.cd<=0)attack();
  if(l>0.05&&P.y<=g+0.02)P.bob+=dt*sp*2;
}
function updateCamera(){
  const sh=S.shake*0.18;
  camera.position.set(P.x+(Math.random()-0.5)*sh,P.y+1.58+Math.sin(P.bob)*0.035+(Math.random()-0.5)*sh,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  const sw=Math.sin(P.swing/0.22*Math.PI),portrait=camera.aspect<1;
  view.position.set((portrait?0.1:0.2)-sw*0.07,-0.17+Math.sin(P.bob)*0.006+sw*0.02,-0.33-sw*0.05);
  view.rotation.set(-sw*1.0,sw*0.45,0);view.scale.setScalar(0.5);
}
function bossHere(){const r=roomAt(P.x,P.z);
  return enemies.find(e=>(e.kind==='boss'||e.kind==='strict')&&e.dead<=0&&e.awake&&r===e.home)||null;}
const MAP_COLORS={stairs:'#96a8b4',support:'#78c878',korean:'#f0b45a',first:'#f082aa',office:'#d23c46',canteen:'#e1a046',wc:'#8cc8dc',cls:'#e1c88c',hall:'#aa82d2',
  teachers:'#64b4dc',english:'#e6a0be',strict:'#968ca0',pe:'#dc8c50',science:'#78d2c3'};
const MAP_MARK={stairs:'▲▼',support:'♥',korean:'한',first:'1',office:'★',canteen:'食',wc:'WC',hall:'♪',teachers:'✎',english:'ABC',strict:'A!',pe:'체',science:'H₂O'};
function drawMap(){   // круглая мини-карта: ты в центре, куда смотришь — то вверху
  const c=$('map'),g=c.getContext('2d'),size=c.width,R=size/2,k=9,L=F.len;   // k — точек на метр
  const X=x=>(x-P.x)*k,Z=z=>(z-P.z)*k;
  const rect=(x0,x1,z0,z1,fill)=>{g.fillStyle=fill;g.fillRect(X(x0),Z(z0),(x1-x0)*k,(z1-z0)*k);};
  const line=(x0,z0,x1,z1,color,w)=>{g.strokeStyle=color||'#1e1e28';g.lineWidth=w||4;g.beginPath();g.moveTo(X(x0),Z(z0));g.lineTo(X(x1),Z(z1));g.stroke();};
  const dot=(x,z,r,fill)=>{g.fillStyle=fill;g.strokeStyle='#1e1e28';g.lineWidth=2;g.beginPath();g.arc(X(x),Z(z),r,0,7);g.fill();g.stroke();};
  g.clearRect(0,0,size,size);g.save();g.beginPath();g.arc(R,R,R-5,0,7);g.clip();
  g.fillStyle='#12162c';g.fillRect(0,0,size,size);
  g.translate(R,R);g.rotate(P.yaw);
  rect(-STAIR,L+STAIR,0,CORR,'#d2dce6');
  F.rooms.forEach(r=>rect(r.x0,r.x1,-DEPTH,0,r.type==='stairs'?'#d2dce6':MAP_COLORS[r.type]));
  // лестницы: полоски-ступеньки
  [[-STAIR,-SIDE.u0],[L+SIDE.u0,L+STAIR]].forEach(([a,b])=>{rect(a,b,0,CORR,'#8c96a8');for(let x=a;x<=b;x+=0.55)line(x,0,x,CORR,'#4a5468',2);});
  const ms=mainStair();rect(ms.x0,ms.x1,-DEPTH,-MAIN.u0,'#8c96a8');for(let z=-DEPTH;z<=-MAIN.u0;z+=0.65)line(ms.x0,z,ms.x1,z,'#4a5468',2);
  // стены
  line(-STAIR,CORR,L+STAIR,CORR);line(-STAIR,0,-STAIR,CORR);line(L+STAIR,0,L+STAIR,CORR);line(-STAIR,0,0,0);line(L,0,L+STAIR,0);
  F.rooms.forEach(r=>{line(r.x0,-DEPTH,r.x1,-DEPTH);line(r.x0,-DEPTH,r.x0,0);line(r.x1,-DEPTH,r.x1,0);
    if(r.type!=='stairs'){const a=r.x0+1.9,b=r.x1-1.9,h=DOOR_W/2;line(r.x0,0,a-h,0);line(a+h,0,b-h,0);line(b+h,0,r.x1,0);}});
  // двери: коричневая закрыта, зелёная открыта, красная заперта
  F.doors.forEach(d=>{if(passable(d)){const o=d.x+d.dir*DOOR_W;line(o-DOOR_W/2,0.25,o+DOOR_W/2,0.25,'#46c85a',5);}
    else line(d.x-DOOR_W/2,0,d.x+DOOR_W/2,0,(d.locked&&!S.hasKey)?'#e6283c':'#965f32',6);});
  // подписи помещений (всегда ровные)
  F.rooms.forEach(r=>{g.save();g.translate(X(r.x0+r.w/2),Z(r.type==='stairs'?-6.2:-DEPTH/2));g.rotate(-P.yaw);
    textFit(g,r.type==='cls'?r.id:MAP_MARK[r.type],0,0,70,22,'#1e1e28');g.restore();});
  F.pickups.forEach(q=>{if(q.wait>0)return;if(q.kind==='key')dot(q.x,q.z,8,'#fadc3c');else dot(q.x,q.z,3.5,q.kind==='pie'?'#ff96aa':'#ffffff');});
  F.enemies.forEach(e=>{if(e.dead<=0)dot(e.x,e.z,Math.max(4.5,e.k.r*k*0.75),e.kind==='boss'||e.kind==='strict'?'#a032c8':'#e6283c');});
  g.restore();
  // куда идти: золотая стрелка на краю карты (ключ или кабинет директора на этом этаже)
  const key=F.pickups.find(q=>q.kind==='key'),office=F.rooms.find(r=>r.type==='office');
  const goal=key?[key.x,key.z]:(S.hasKey&&office?[office.x0+1.9,0]:null);
  if(goal){const dx=goal[0]-P.x,dz=goal[1]-P.z;
    if(Math.hypot(dx,dz)*k>R-20){const a=Math.atan2(dx*Math.sin(P.yaw)+dz*Math.cos(P.yaw),dx*Math.cos(P.yaw)-dz*Math.sin(P.yaw));
      g.save();g.translate(R+Math.cos(a)*(R-18),R+Math.sin(a)*(R-18));g.rotate(a);g.fillStyle='#fadc3c';g.strokeStyle='#1e1e28';g.lineWidth=3;
      g.beginPath();g.moveTo(14,0);g.lineTo(-7,10);g.lineTo(-7,-10);g.closePath();g.fill();g.stroke();g.restore();}}
  // ты
  g.fillStyle='#2878ff';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(R,R-14);g.lineTo(R+10,R+10);g.lineTo(R,R+5);g.lineTo(R-10,R+10);g.closePath();g.fill();g.stroke();
  // рамка
  g.lineWidth=8;g.strokeStyle='#1e1e28';g.beginPath();g.arc(R,R,R-5,0,7);g.stroke();
  g.lineWidth=2.5;g.strokeStyle='#ffe178';g.beginPath();g.arc(R,R,R-5,0,7);g.stroke();
}
function hud(dt){
  $('hearts').innerHTML='<span style="color:#e63c50">'+'♥'.repeat(Math.max(0,P.hp))+'</span><span style="color:#5a5a64">'+'♥'.repeat(Math.max(0,P.max-P.hp))+'</span>';
  const w=WEAPONS[P.weapon],label=(P.weapon==='fists'&&klass().kick)?'kickName':P.weapon;
  $('weapon').textContent=tr(label)+(w.ammo?'  x'+(P.ammo[P.weapon]||0):'')+(S.hasKey?'  🔑':'')+'  ◉'+save.coins;
  const r=roomAt(P.x,P.z);
  $('place').textContent=F.home?tr(P.z>20?(P.x>11.2?'bath':P.x>2.7?'home':P.x<-0.3?'lift':'hall20'):P.x<-0.3?'lift':P.x<DOOR_X+0.2&&P.z>0?'lobby':P.z<-45.5-LONG?'yard':'street'):tr('floor',F.n)+' · '+(r?roomName(r):tr((P.x<0||P.x>F.len||P.z<-0.3)?'stairs':'corridor'));
  const boss=bossHere();
  $('goal').textContent=F.home&&!morningDone()?tr('goalMorning')+': '+jobsLeft().map(k=>tr('job_'+k)).join(' · '):tr(F.home?(!F.ate?'goalEat':!F.flatOpen?'goalExit':F.lift.at==='up'?'goalLift':!F.out?'goalLobby':(F.gang&&F.gang.stage==='ice')?(F.gang.have?'goalGive':'goalIce'):'goalSchool'):(r&&r.type==='office')?'goalBoss':(S.hasKey?'goalOffice':'goalKey'));
  $('boss').classList.toggle('hide',!boss);
  if(boss){$('bossfill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';$('bossname').textContent=tr(boss.kind==='boss'?'bossName':'strictName');}
  const d=nearDoor(),spot=F.home?homeSpot():null;
  $('hint').textContent=spot?tr(spot.hint):d?tr(d.locked&&!S.hasKey?'lockedHint':(d.open?'closeHint':'openHint')):'';
  $('tDoor').classList.toggle('hide',!d&&!spot);
  $('map').style.display=F.home?'none':'';
  if(S.msgT>0){S.msgT-=dt;if(S.msgT<=0)$('msg').textContent='';}
  if(S.toastT>0){S.toastT-=dt;if(S.toastT<=0)$('toast').textContent='';}
  S.mapT-=dt;if(S.mapT<=0&&!F.home){S.mapT=0.033;drawMap();}
}
function update(dt){
  if(S.state==='cut'){if(hc)updateHC(dt);else updateCut(dt);return;}
  if(S.state!=='play')return;
  S.time+=dt;
  updateDoors(dt);updatePlayer(dt);
  if(F.home){updateLift(dt);updateStreet(dt);updateGang(dt);updateSchoolDoor(dt);if(atSchoolDoor()){enterSchool();return;}}
  const r=roomAt(P.x,P.z);
  if(r!==S.lastRoom){S.lastRoom=r;if(r&&r.safe)say('safe');if(r&&r.id==='5-1')say('npc','',4.5);if(r&&r.type==='office'&&!S.won)say('gHelp','',3);}
  for(const e of [...enemies]){if(Math.abs(e.x-P.x)<34||e.dead>0)updateEnemy(e,dt);if(S.state!=='play')return;}
  updateProjectiles(dt);if(S.state!=='play')return;
  updatePickups(dt);updateParticles(dt);
  if(S.won){S.winT-=dt;if(S.winT<=0){S.won=false;finalCut(()=>{S.state='win';earn(100);show('win');unlock();});}}
}
function render(dt){
  S.shake=Math.max(0,S.shake-dt);P.hurt=Math.max(0,P.hurt-dt);
  const inMenu=S.state==='menu';
  menuWorld.visible=inMenu;floors.forEach(f=>{if(f)f.group.visible=!inMenu;});if(HOME)HOME.group.visible=!inMenu;
  const day=!inMenu&&!!F.home;
  scene.background=inMenu?menuSky:day?daySky:gameSky;scene.fog.color.setHex(inMenu?0x241a40:day?0xc4e4ff:0x2a2040);scene.fog.near=inMenu?30:day?36:28;scene.fog.far=inMenu?85:day?95:60;
  if(inMenu)updateMenu(dt);
  else{updateCamera();hud(dt);$('hurt').style.opacity=Math.min(1,P.hurt*1.8);}
  view.visible=S.state!=='menu'&&S.state!=='cut';
  if(S.blink){const b=hc?hc.t:9;if(b>2.4)S.blink=0;   // глаза открываются: темно, моргнул, ещё раз
    S.fade=b<0.8?1:b<1.6?0.35+0.3*Math.abs(Math.cos(b*6)):b<2.4?0.15*Math.abs(Math.sin(b*7)):0;S.fade/=1.5;$('fade').textContent='';}
  else if(S.fade>0)S.fade=Math.max(0,S.fade-dt*1.4);
  $('fade').style.opacity=Math.min(1,S.fade*1.5);
  if(!F.home){alignFloors();
    const eye=camera.position.x,close=Math.abs(P.x-anchor(F,nearStair()))<10;
    floors.forEach(f=>{if(f&&Math.abs(f.n-F.n)<=1)cullFloor(f,f===F?30:close?16:0,eye-f.group.position.x);});}
  updateLights(!inMenu);
  renderer.render(scene,camera);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);render(dt);requestAnimationFrame(loop);
}
buildMenu();dressHero();goFloor(1);applyLang();setWeapon('fists');show('menu');requestAnimationFrame(loop);

window.ZS={S,P,PLAN,WEAPONS,KINDS,keys,camera,renderer,scene,floors,get floor(){return F;},get enemies(){return enemies;},
  startGame,retry,update,render,enterSchool,get hc(){return hc;},endHC,endCut,get cut(){return cut;},attack,spawnEnemy,quest,ensureQuests,save,CLASSES,SKINS,shopOpen,pickItem,useDoor,setWeapon,nextWeapon,damage,hurtPlayer,changeFloor,goFloor,pause,resume,toMenu,
  setLang:l=>{lang=l;applyLang();},T};

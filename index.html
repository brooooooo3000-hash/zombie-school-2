let lang='ru';
try{const s=localStorage.getItem('zs2_lang');
  lang=LANGS.includes(s)?s:(LANGS.includes((navigator.language||'').slice(0,2))?navigator.language.slice(0,2):'en');}catch(e){}
const tr=(k,n)=>T[k][LANGS.indexOf(lang)].replace('{n}',(n===undefined||n===null)?'':n);

/* ====================== ЗВУК (рисуется кодом) ====================== */
let AC=null;
function beep(freq,dur,type,vol,slide){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(vol||0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
}
const SND={swing:()=>beep(320,0.08,'triangle',0.05,120),hit:()=>beep(160,0.12,'square',0.08,60),
  shot:()=>beep(700,0.09,'sine',0.07,260),boom:()=>beep(120,0.45,'sawtooth',0.14,30),hurt:()=>beep(220,0.25,'sawtooth',0.12,70),
  pick:()=>{beep(520,0.1,'square',0.06);setTimeout(()=>beep(780,0.12,'square',0.06),80);},
  die:()=>beep(200,0.3,'triangle',0.08,45),door:()=>beep(240,0.22,'triangle',0.06,150),roar:()=>beep(75,0.7,'sawtooth',0.13,45),
  step:()=>beep(140,0.25,'triangle',0.06,320)};

/* ====================== СЦЕНА ====================== */
const canvas=$('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:!isTouch});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0c22);
scene.fog=new THREE.Fog(0x2a2040,22,46);
const camera=new THREE.PerspectiveCamera(74,1,0.05,70);
camera.rotation.order='YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff,0xb4a8a0,0.76));
const sun=new THREE.DirectionalLight(0xffffff,0.38);sun.position.set(5,9,6);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w<h?90:74;camera.updateProjectionMatrix();}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();

/* ----- мультяшный стиль: плавные картинки, «ступенчатый» свет и чёрные контуры; цвета как в первой части ----- */
function canvasTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;
  if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);}
  return t;
}
const gradCanvas=document.createElement('canvas');gradCanvas.width=4;gradCanvas.height=1;
['#8a8a8a','#b4b4b4','#e6e6e6','#ffffff'].forEach((c,i)=>{const g=gradCanvas.getContext('2d');g.fillStyle=c;g.fillRect(i,0,1,1);});
const gradient=new THREE.CanvasTexture(gradCanvas);gradient.magFilter=gradient.minFilter=THREE.NearestFilter;gradient.generateMipmaps=false;
const lam=opt=>new THREE.MeshToonMaterial(Object.assign({gradientMap:gradient},opt));
const matCache={},texCache={};
const col=c=>matCache[c]||(matCache[c]=lam({color:c}));
const asMat=m=>typeof m==='number'?col(m):m;
const INK=0x1e1e28;
const inkMat=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide});
const lineMat=new THREE.LineBasicMaterial({color:INK});
let target=scene;   // куда складывать новые предметы (при стройке этажа — в его комнату)
function add(geo,mat,x,y,z,parent){const m=new THREE.Mesh(geo,asMat(mat));m.position.set(x,y,z);(parent||target).add(m);return m;}
function box(w,h,d,mat,x,y,z,parent){return add(new THREE.BoxGeometry(w,h,d),mat,x,y,z,parent);}
function edged(m){m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),lineMat));return m;}
function ball(r,mat,x,y,z,parent,ink){const m=add(new THREE.SphereGeometry(r,16,12),mat,x,y,z,parent);
  if(ink)m.add(new THREE.Mesh(new THREE.SphereGeometry(r+ink,16,12),inkMat));return m;}
function tube(r1,r2,h,mat,x,y,z,parent,ink){const m=add(new THREE.CylinderGeometry(r1,r2,h,14),mat,x,y,z,parent);
  if(ink)m.add(new THREE.Mesh(new THREE.CylinderGeometry(r1+ink,r2+ink,h+ink*2,14),inkMat));return m;}

function sameSpace(ax,az,bx,bz){   // можно ли достать друг друга: одно помещение или оба у открытой двери (не сквозь стену)
  if(roomAt(ax,az)===roomAt(bx,bz))return true;
  for(const d of F.doors)if(passable(d)&&Math.hypot(ax-d.x,az)<2.4&&Math.hypot(bx-d.x,bz)<2.4)return true;
  return false;
}

/* ====================== ДВИЖЕНИЕ ====================== */
function pushOut(o,r,c){
  const cx=Math.max(c.x0,Math.min(o.x,c.x1)),cz=Math.max(c.z0,Math.min(o.z,c.z1)),dx=o.x-cx,dz=o.z-cz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return;
  if(d2>1e-8){const d=Math.sqrt(d2);o.x=cx+dx/d*r;o.z=cz+dz/d*r;}
  else{const a=o.x-c.x0,b=c.x1-o.x,e=o.z-c.z0,f=c.z1-o.z,m=Math.min(a,b,e,f);
    if(m===a)o.x=c.x0-r;else if(m===b)o.x=c.x1+r;else if(m===e)o.z=c.z0-r;else o.z=c.z1+r;}
}
function collide(o,r,feet,step){for(const c of colliders){if(c.off||c.top<=feet+step||c.x0>o.x+r+0.1||c.x1<o.x-r-0.1)continue;pushOut(o,r,c);}}
function groundAt(x,z,r,feet,step){
  let g=0;for(const c of colliders){if(c.off||c.top>feet+step||c.top<=g)continue;
    if(x+r*0.7>c.x0&&x-r*0.7<c.x1&&z+r*0.7>c.z0&&z-r*0.7<c.z1)g=c.top;}return g;
}
/* Любое движение (ходьба, отбрасывание, толчки) идёт шажками по 8 см: рывком сквозь стену не проскочить.
   Запасная защита: шаг за пределы школы или в соседнее помещение не через открытую дверь отменяется. */
function moveBy(o,dx,dz,r,feet,step){
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dz)/0.08));
  for(let i=0;i<n;i++){const px=o.x,pz=o.z;o.x+=dx/n;o.z+=dz/n;collide(o,r,feet,step);collide(o,r,feet,step);
    if(!insideSchool(o.x,o.z)||!sameSpace(px,pz,o.x,o.z)){o.x=px;o.z=pz;return;}}
}

/* ====================== ДВЕРИ ====================== */
function nearDoor(){
  let best=null,bd=1.75;if(!F)return null;
  for(const d of F.doors){const k=Math.hypot(P.x-d.x,P.z);if(k<bd){bd=k;best=d;}}
  return best;
}
function inDoorway(d){const hit=o=>Math.abs(o.x-d.x)<DOOR_W/2+0.3&&Math.abs(o.z)<0.58;return hit(P)||enemies.some(e=>e.dead<=0&&hit(e));}
function useDoor(){
  const d=nearDoor();if(!d||S.state!=='play')return;
  if(d.locked){
    if(!S.hasKey){say('locked');SND.hit();return;}
    d.room.doors.forEach(q=>q.locked=false);say('unlocked');
  }
  if(d.open&&inDoorway(d))return;   // в проёме кто-то стоит: не прищемить
  d.open=!d.open;SND.door();
}
function updateDoors(dt){
  for(const d of F.doors){const want=d.open?1:0;
    if(d.amt!==want)d.amt=want>d.amt?Math.min(1,d.amt+dt*3.2):Math.max(0,d.amt-dt*3.2);
    d.mesh.position.x=d.x+d.dir*d.amt*(DOOR_W-0.04);d.col.off=passable(d);}
}

  if(e.awake)return;e.awake=true;e.age=0;
  if(e.kind==='giant'){say('giant');SND.roar();}
  if(e.kind==='boss'){say('bossStart','',3);SND.roar();}
  if(e.kind==='strict'){say('strictStart');SND.roar();}
}
/* куда идти: прямо к герою или к двери (своей, чтобы выйти, или той комнаты, где герой) */
function chaseTarget(e,dt){
  const a=roomAt(e.x,e.z),b=roomAt(P.x,P.z);
  if(a===b)return [P.x,P.z];
  const through=a||b,goingIn=!a;
  let d=through.doors[0];const ref=goingIn?e.x:P.x;
  if(Math.abs(through.doors[1].x-ref)<Math.abs(d.x-ref))d=through.doors[1];
  if(!passable(d)&&!d.locked&&Math.hypot(e.x-d.x,e.z)<1.7){e.doorT+=dt;if(e.doorT>1.2){d.open=true;e.doorT=0;SND.door();}}
  const lined=Math.abs(e.x-d.x)<0.35&&Math.abs(e.z)<1.8;
  if(!lined)return [d.x,goingIn?1.1:-1.1];
  return [d.x,goingIn?-1.5:1.5];
}
function updateEnemy(e,dt){
  if(e.dead>0){e.dead+=dt;e.m.g.rotation.x=-Math.min(1,e.dead/0.35)*Math.PI/2;
    if(e.dead>0.8)e.m.g.position.y-=dt*1.2;if(e.dead>1.5)removeEnemy(e);return;}
  const dx=P.x-e.x,dz=P.z-e.z,dist=Math.hypot(dx,dz);
  const mine=roomAt(e.x,e.z),his=roomAt(P.x,P.z);
  if(!e.awake){
    const near=e.home?his===e.home:(his===null&&dist<11);
    if(near||e.hp<e.max)wake(e);else return;
  }
  e.cd=Math.max(0,e.cd-dt);e.age+=dt;
  if(e.flash>0){e.flash-=dt;if(e.flash<=0)e.m.mats.forEach(m=>m.emissive.setHex(0));}
  // в класс поддержки враги не заходят, а учителя и директор не выходят из своих кабинетов
  const teacher=e.kind==='boss'||e.kind==='strict';
  const idle=!!(his&&his.safe)||(teacher&&his!==e.home);
  let moving=0;
  if(e.flying){
    e.vy-=14*dt;e.y+=e.vy*dt;moveBy(e,e.vx*dt,e.vz*dt,e.k.r,e.y,0.5);
    const g=groundAt(e.x,e.z,e.k.r,e.y,0.4);if(e.y<=g&&e.vy<0){e.y=g;e.flying=false;}
  }else{
    if(e.stun>0)e.stun-=dt;
    else if(idle){/* стоит и ждёт */}
    else if(teacher)moving=updateTeacher(e,dt,dx,dz,dist);
    else if(dist<30){
      const t=chaseTarget(e,dt),tx=t[0]-e.x,tz=t[1]-e.z,l=Math.hypot(tx,tz)||1;
      const stop=e.k.r+0.35+e.k.reach*0.6;
      if(!(dist<stop&&mine===his)){moveBy(e,tx/l*e.speed*dt,tz/l*e.speed*dt,e.k.r,e.y,1.0);moving=e.speed;}
      e.m.g.rotation.y=Math.atan2(tx,tz);
    }
    for(const o of enemies){if(o===e||o.dead>0||Math.abs(o.x-e.x)>2)continue;const ox=e.x-o.x,oz=e.z-o.z,d=Math.hypot(ox,oz),m=(e.k.r+o.k.r)*0.85;
      if(d<m&&d>1e-4){const push=(m-d)*(o.k.r/(e.k.r+o.k.r));moveBy(e,ox/d*push,oz/d*push,e.k.r,e.y,1.0);}}
    const g=groundAt(e.x,e.z,e.k.r,e.y,1.0);
    if(e.y>g+0.02||e.vy>0){e.vy-=14*dt;e.y+=e.vy*dt;if(e.y<g){e.y=g;e.vy=0;}}
    else{e.y+=(g-e.y)*Math.min(1,dt*12);e.vy=0;
      if(e.k.hop&&e.stun<=0&&!idle){e.hopT-=dt;if(e.hopT<=0){e.vy=4.2;e.y+=0.03;e.hopT=0.8+Math.random();}}}
    e.anim+=moving*dt*3.2;
  }
  if(e.carries&&e.stun<=0&&dist<10&&mine===his&&(e.hp<=e.max*0.6||e.age>7))throwImp(e);
  const reach=e.k.r+0.35+e.k.reach;
  if(e.cd<=0&&e.stun<=0&&!idle&&dist<reach&&P.y<e.y+e.k.h&&P.y+1.6>e.y&&sameSpace(e.x,e.z,P.x,P.z)){
    e.cd=1.1;hurtPlayer(e.kind==='boss'&&e.state==='charge'?2:e.k.dmg,e.x,e.z);}
  const s=Math.sin(e.anim),m=e.m;
  m.legs[0].rotation.x=s*0.6;m.legs[1].rotation.x=-s*0.6;
  const bite=e.cd>0.85;
  m.arms[0].rotation.x=(bite?-0.5:0)+s*0.14;m.arms[1].rotation.x=(bite?-0.5:0)-s*0.14;
  if(e.state==='throw')m.arms[1].rotation.x=-1.8;
  m.head.rotation.z=e.stun>0?Math.sin(e.age*14)*0.3:Math.sin(e.anim*0.5)*0.08;
  m.g.position.set(e.x+(e.state==='windup'?(Math.random()-0.5)*0.12:0),e.y,e.z);
}
function updateTeacher(b,dt,dx,dz,dist){   // директор: двойки, таран, подмога. Учитель английского: кидает «F»
  b.t+=dt;const boss=b.kind==='boss';
  if(boss&&!b.phase2&&b.hp<=b.max/2){b.phase2=true;b.speed=2.1;say('bossHelp');SND.roar();
    [[1.8,-2.4],[b.home.w-1.8,-2.4],[b.home.w/2,-7.8]].forEach(p=>{spawnEnemy(b.floor,'zombie',b.home.x0+p[0],p[1],b.home).awake=true;});}
  const face=()=>b.m.g.rotation.y=Math.atan2(dx,dz);
  const set=s=>{b.state=s;b.t=0;};
  const walk=()=>{if(dist>b.k.r+0.7){moveBy(b,dx/(dist||1)*b.speed*dt,dz/(dist||1)*b.speed*dt,b.k.r,b.y,1.1);return b.speed;}return 0;};
  if(b.state==='walk'){face();b.throwCd-=dt;b.chargeCd-=dt;
    if(b.throwCd<=0)set('throw');else if(boss&&b.chargeCd<=0){set('windup');SND.roar();}
    return walk();}
  if(b.state==='throw'){face();if(b.t>0.55){
      (b.phase2?[-0.28,0,0.28]:[0]).forEach(a=>{const ang=Math.atan2(dx,dz)+a;
        throwCard(b.x+Math.sin(ang)*0.8,b.y+1.8,b.z+Math.cos(ang)*0.8,ang,(P.y+1.2-(b.y+1.8))/Math.max(0.35,dist/9),boss?0:1);});
      b.throwCd=b.phase2?1.9:2.6;set('walk');}return 0;}
  if(b.state==='windup'){face();if(b.t>0.8){const l=dist||1;b.dirx=dx/l;b.dirz=dz/l;set('charge');b.cd=0;}return 0;}
  if(b.state==='charge'){moveBy(b,b.dirx*8*dt,b.dirz*8*dt,b.k.r,b.y,1.1);
    if(b.t>0.9){set('tired');b.chargeCd=b.phase2?4:6;}return 8;}
  if(b.state==='tired'&&b.t>(b.phase2?1.0:1.5))set('walk');
  return 0;
}
function throwImp(e){
  e.m.g.remove(e.carries);e.carries=null;
  const imp=spawnEnemy(e.floor,'imp',e.x,e.z,e.home),dx=P.x-e.x,dz=P.z-e.z;
  imp.awake=true;imp.y=2.2;imp.vy=3.5;const flight=0.85;imp.vx=dx/flight;imp.vz=dz/flight;imp.flying=true;imp.cd=0.7;
  imp.m.g.position.set(imp.x,imp.y,imp.z);say('impThrow');SND.roar();
}
function damage(e,dmg,fromX,fromZ,knock,stun){
  if(e.dead>0)return;
  wake(e);e.hp-=dmg;e.flash=0.12;e.m.mats.forEach(m=>m.emissive.setHex(0x888888));
  const dx=e.x-fromX,dz=e.z-fromZ,l=Math.hypot(dx,dz)||1,kb=(knock||0)*(e.k.kb===undefined?1:e.k.kb);
  moveBy(e,dx/l*kb,dz/l*kb,e.k.r,e.y,1.0);
  if(stun)e.stun=Math.max(e.stun,Math.min(stun,e.k.stunMax===undefined?stun:e.k.stunMax));
  burst(e.x,e.y+e.k.h*0.6,e.z,0x78c878,6);SND.hit();
  if(e.hp<=0){e.dead=0.001;S.kills++;SND.die();
    if(e.carries){e.m.g.remove(e.carries);e.carries=null;const i=spawnEnemy(e.floor,'imp',e.x,e.z,e.home);
      i.awake=true;moveBy(i,0.6,0,i.k.r,1.6,0.5);i.y=1.5;i.flying=true;i.vy=3;}
    if(e.kind==='boss'){S.won=true;S.winT=1.4;}
    else if(Math.random()<0.22)addPickup(e.floor,'pie',e.x,e.z);}
}

/* ====================== ГЕРОЙ И ОРУЖИЕ ====================== */
const WEAPONS={
  fists:{type:'melee',dmg:1,range:1.5,cd:0.42,kb:0.35},
  ruler:{type:'melee',dmg:1.6,range:1.9,cd:0.3,kb:0.35},
  mop:{type:'melee',dmg:2,range:2.7,cd:0.55,kb:0.9},
  chair:{type:'melee',dmg:3.5,range:1.9,cd:0.75,kb:0.8,stun:0.7},
  watergun:{type:'shot',dmg:1.2,cd:0.24,ammo:40,speed:19,kb:0.2},
  piebomb:{type:'bomb',dmg:6,cd:0.8,ammo:4,speed:11,area:3.2,kb:1.0}
};
const ORDER=Object.keys(WEAPONS);
const P={x:0,y:0,z:2,vy:0,yaw:0,pitch:0,hp:5,max:5,cd:0,swing:0,inv:0,hurt:0,weapon:'fists',ammo:{},have:{fists:true},bob:0};
const view=new THREE.Group();camera.add(view);
function weaponModel(key){

  const sleeve=tube(0.065,0.075,0.26,0x466edc,0.02,-0.035,0.17,g,L);sleeve.rotation.x=Math.PI/2;   // рукав и ладонь — всегда первые два
  ball(0.075,0xfad7b4,0,0,0,g,L);
  const along=m=>{m.rotation.x=Math.PI/2;return m;};
  if(key==='fists')ball(0.04,0xfad7b4,-0.05,0.035,-0.04,g,L);
  if(key==='ruler'){edged(box(0.08,0.018,0.64,0xf0dc64,0,0.04,-0.34,g));for(let i=0;i<7;i++)box(0.035,0.004,0.008,INK,-0.02,0.052,-0.12-i*0.08,g);}
  if(key==='mop'){along(tube(0.024,0.024,0.95,0x965f32,0,0.02,-0.44,g,L));
    for(let i=-3;i<=3;i++){const s=tube(0.022,0.028,0.24,0xcdcdd7,i*0.04,-0.06,-0.93,g,L);s.rotation.z=i*0.14;}
    along(tube(0.07,0.07,0.1,0x69411e,0,0.025,-0.91,g,L));}
  if(key==='chair'){edged(box(0.34,0.05,0.32,0x965f32,0,0.1,-0.3,g));edged(box(0.34,0.2,0.04,0x965f32,0,0.36,-0.45,g));
    [-0.13,0.13].forEach(x=>tube(0.018,0.018,0.28,0x69411e,x,0.24,-0.45,g,L));
    [[-0.14,-0.17],[0.14,-0.17],[-0.14,-0.43],[0.14,-0.43]].forEach(p=>tube(0.02,0.016,0.28,0x69411e,p[0],-0.05,p[1],g,L));}
  if(key==='watergun'){along(tube(0.065,0.065,0.36,0x6eaaff,0,0.07,-0.13,g,L));along(tube(0.03,0.04,0.18,0xff8c28,0,0.075,-0.39,g,L));
    ball(0.1,0xebf5ff,0,0.19,-0.05,g,L);ball(0.025,0xf0dc64,0,0.19,-0.16,g,L);}
  if(key==='piebomb'){tube(0.15,0.11,0.1,0xe1a046,0,0.1,-0.1,g,L);const cr=ball(0.12,0xffe1a0,0,0.14,-0.1,g,L);cr.scale.y=0.55;
    ball(0.035,0xd22d37,0.05,0.21,-0.07,g,L);tube(0.012,0.012,0.13,INK,-0.02,0.27,-0.12,g);ball(0.032,0xff8c28,-0.02,0.35,-0.12,g);}
  return g;
}
let viewKey=null;
function setWeapon(key){P.weapon=key;if(viewKey!==key){view.clear();view.add(weaponModel(key));viewKey=key;}}
const usable=k=>!!P.have[k]&&(WEAPONS[k].type==='melee'||P.ammo[k]>0);
function nextWeapon(){
  let i=ORDER.indexOf(P.weapon);
  for(let n=0;n<ORDER.length;n++){i=(i+1)%ORDER.length;if(usable(ORDER[i])){setWeapon(ORDER[i]);return;}}
}
function forward(){return [-Math.sin(P.yaw),-Math.cos(P.yaw)];}
function attack(){
  if(P.cd>0||S.state!=='play')return;
  const key=P.weapon,w=WEAPONS[key];P.cd=w.cd;P.swing=0.22;
  const f=forward();
  if(w.type==='melee'){SND.swing();
    for(const e of [...enemies]){if(e.dead>0)continue;const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz)||1e-3;
      if(d-e.k.r>w.range||P.y>e.y+e.k.h||P.y+1.8<e.y)continue;
      if((dx*f[0]+dz*f[1])/d<0.55&&d>e.k.r+0.3)continue;
      if(!sameSpace(e.x,e.z,P.x,P.z))continue;
      damage(e,w.dmg,P.x,P.z,w.kb,w.stun);}
    return;
  }
  if(!(P.ammo[key]>0)){say('empty');nextWeapon();return;}
  P.ammo[key]--;SND.shot();
  const cp=Math.cos(P.pitch),dir=new THREE.Vector3(f[0]*cp,Math.sin(P.pitch),f[1]*cp);
  const bomb=w.type==='bomb';
  const mesh=bomb?ball(0.17,0xe1a046,0,0,0,scene,0.02):ball(0.085,flat({color:0x7ee4ff}),0,0,0,scene,0.015);
  if(bomb)mesh.scale.y=0.65;else mesh.scale.z=1.7;
  mesh.position.set(P.x+f[0]*0.35,P.y+1.38,P.z+f[1]*0.35);mesh.rotation.y=P.yaw;
  projectiles.push({mesh,vx:dir.x*w.speed,vy:dir.y*w.speed+(bomb?3.2:0),vz:dir.z*w.speed,w,bomb,life:2.5,enemy:false});
  if(P.ammo[key]<=0)setTimeout(()=>{if(P.weapon===key&&!(P.ammo[key]>0))nextWeapon();},250);
}
const cardMats=['2','F'].map(ch=>flat({map:canvasTex(64,80,(g)=>{g.fillStyle='#fafaf5';g.fillRect(0,0,64,80);g.strokeStyle='#1e1e28';g.lineWidth=6;
  g.strokeRect(3,3,58,74);g.fillStyle='#d72332';g.font='bold 56px Verdana';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,32,43);})}));
function throwCard(x,y,z,ang,vy,kind){
  const mesh=box(0.46,0.6,0.05,cardMats[kind],x,y,z,scene);
  projectiles.push({mesh,vx:Math.sin(ang)*9,vy,vz:Math.cos(ang)*9,life:2.5,enemy:true,bomb:false});SND.swing();
}
function explode(x,y,z,w){
  SND.boom();burst(x,y+0.3,z,0xffb43c,26);burst(x,y+0.3,z,0xffe1a0,18);S.shake=0.35;
  for(const e of [...enemies]){const d=Math.hypot(e.x-x,e.z-z)-e.k.r;if(e.dead<=0&&d<w.area&&Math.abs(e.y-y)<3&&sameSpace(e.x,e.z,x,z))damage(e,w.dmg,x,z,w.kb,0.8);}
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i],m=p.mesh.position;p.life-=dt;
    let done=p.life<=0;
    for(let n=0;n<6&&!done;n++){
      const st=dt/6,ox=m.x,oz=m.z;if(p.bomb)p.vy-=12*st;m.x+=p.vx*st;m.y+=p.vy*st;m.z+=p.vz*st;
      if(p.enemy){if(Math.hypot(m.x-P.x,m.z-P.z)<0.55&&m.y>P.y&&m.y<P.y+1.9){hurtPlayer(1,m.x-p.vx,m.z-p.vz);done=true;}}
      else for(const e of enemies){if(e.dead>0)continue;
        if(Math.hypot(m.x-e.x,m.z-e.z)<e.k.r+0.18&&m.y>e.y-0.1&&m.y<e.y+e.k.h+0.15){
          if(!p.bomb)damage(e,p.w.dmg,m.x-p.vx,m.z-p.vz,p.w.kb);done=true;break;}}
      if(!done){const hitWall=colliders.some(c=>!c.off&&m.x>c.x0&&m.x<c.x1&&m.z>c.z0&&m.z<c.z1&&m.y<c.top);
        if(hitWall||m.y<0.05||m.y>ROOM_H){done=true;m.x=ox;m.z=oz;}}   // взрыв по эту сторону стены
    }
    if(p.enemy)p.mesh.rotation.y+=dt*10;else if(p.bomb)p.mesh.rotation.x+=dt*8;
    if(done){if(p.bomb)explode(m.x,Math.max(0,m.y),m.z,p.w);else burst(m.x,m.y,m.z,p.enemy?0xffffff:0x78d8ff,5);
      scene.remove(p.mesh);projectiles.splice(i,1);}
  }
}
function burst(x,y,z,color,n){
  for(let i=0;i<n;i++){const m=add(new THREE.SphereGeometry(0.065,8,6),flat({color}),x,y,z,scene);
    particles.push({m,vx:(Math.random()-0.5)*5,vy:Math.random()*4,vz:(Math.random()-0.5)*5,life:0.35+Math.random()*0.35});}
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.vy-=11*dt;
    p.m.position.x+=p.vx*dt;p.m.position.y=Math.max(0.05,p.m.position.y+p.vy*dt);p.m.position.z+=p.vz*dt;
    if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();particles.splice(i,1);}}
}

/* ----- вещи на полу и на партах ----- */
function addPickup(f,kind,x,z,respawn){
  const g=new THREE.Group();
  if(kind==='pie'){tube(0.2,0.15,0.1,0xe1a046,0,0,0,g,0.015);const c=ball(0.15,0xffe1a0,0,0.05,0,g,0.012);c.scale.y=0.55;}
  else if(kind==='key'){add(new THREE.TorusGeometry(0.15,0.045,8,18),0xfadc3c,-0.18,0,0,g);box(0.36,0.07,0.07,0xfadc3c,0.12,0,0,g);
    box(0.07,0.14,0.07,0xfadc3c,0.2,-0.09,0,g);box(0.07,0.1,0.07,0xfadc3c,0.29,-0.07,0,g);}
  else{const w=weaponModel(kind);w.remove(w.children[0]);w.remove(w.children[0]);w.scale.setScalar(1.15);g.add(w);}
  const saved=colliders;colliders=f.colliders;
  const base=groundAt(x,z,0.15,1.0,0);colliders=saved;
  g.position.set(x,base+0.45,z);f.group.add(g);
  f.pickups.push({kind,g,x,z,y:base+0.45,t:Math.random()*6,respawn:!!respawn,wait:0});
}
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){const it=pickups[i];it.t+=dt;it.g.rotation.y+=dt*1.8;it.g.position.y=it.y+Math.sin(it.t*3)*0.08;
    if(it.wait>0){it.wait-=dt;if(it.wait<=0)it.g.visible=true;continue;}
    if(Math.hypot(it.x-P.x,it.z-P.z)>1.0||Math.abs(it.y-P.y-0.45)>1.4||!sameSpace(it.x,it.z,P.x,P.z))continue;
    if(it.kind==='pie'){if(P.hp>=P.max)continue;P.hp++;say('pie');}
    else if(it.kind==='key'){S.hasKey=true;say('gotKey','',3.5);}
    else{const w=WEAPONS[it.kind],fresh=!P.have[it.kind];P.have[it.kind]=true;
      if(w.ammo)P.ammo[it.kind]=(P.ammo[it.kind]||0)+w.ammo;
      if(fresh)setWeapon(it.kind);say('got',tr(it.kind));}
    SND.pick();
    if(it.respawn){it.wait=25;it.g.visible=false;}else{F.group.remove(it.g);pickups.splice(i,1);}}
}

const S={state:'menu',hasKey:false,won:false,winT:0,msgT:0,shake:0,fade:0,kills:0,time:0,mapT:0,lastRoom:null};
function say(key,extra,time){$('msg').textContent=tr(key)+(extra||'');S.msgT=time||2.2;}
function destroyFloors(){
  if(F)scene.remove(F.group);F=null;
  floors.forEach(f=>{if(f)f.group.traverse(o=>{if(o.geometry)o.geometry.dispose();});});floors.length=0;signs.length=0;
  colliders=[];enemies=[];pickups=[];
  projectiles.splice(0).forEach(p=>scene.remove(p.mesh));particles.splice(0).forEach(p=>scene.remove(p.m));
}
function place(x,z,yaw){Object.assign(P,{x,z,y:0,vy:0,yaw,pitch:0,cd:0,swing:0});}
function startGame(){
  Object.assign(S,{state:'play',hasKey:false,won:false,winT:0,kills:0,time:0,fade:1,lastRoom:null});
  destroyFloors();goFloor(1);
  P.have={fists:true};P.ammo={};P.hp=P.max;P.inv=1;P.hurt=0;setWeapon('fists');
  place(-1.8,CORR/2,-Math.PI/2);$('fade').textContent=tr('floor',1);show(null);say('goalKey','',4);lock();
}
function retry(){   // очнуться в классе поддержки; враги снова целые и стоят на местах
  floors.forEach(f=>{if(f)f.enemies.forEach(e=>{if(e.dead>0)return;
    Object.assign(e,{x:e.hx,z:e.hz,y:0,hp:e.max,awake:false,phase2:false,state:'walk',stun:0,vy:0,flying:false});
    if(e.kind==='boss')e.speed=e.k.speed[0];e.m.g.position.set(e.x,0,e.z);});});
  goFloor(1);const r=F.rooms[0];
  place(r.x0+r.w/2,-3.4,Math.PI);P.hp=P.max;P.inv=2;P.hurt=0;S.state='play';S.fade=1;$('fade').textContent=tr('floor',1);show(null);lock();
}
function mainStair(){return F.rooms.find(r=>r.type==='stairs');}
function changeFloor(n,side){   // side: 'w' — западная лестница, 'e' — восточная, 'm' — главная
  goFloor(n);
  const s=mainStair();
  place(side==='w'?-1.8:side==='e'?F.len+1.8:(s.x0+s.x1)/2,CORR/2,side==='e'?Math.PI/2:-Math.PI/2);
  S.fade=1;S.lastRoom=null;$('fade').textContent=tr('floor',n);SND.step();
}
function checkStairs(){
  const west=P.x<-3.5,east=P.x>F.len+3.5,s=mainStair();
  const main=P.z<-4&&P.x>s.x0&&P.x<s.x1;
  if(!west&&!east&&!main)return;
  const n=F.n+((main?P.x<(s.x0+s.x1)/2:P.z<CORR/2)?1:-1);
  if(n>=1&&n<=PLAN.length)changeFloor(n,main?'m':west?'w':'e');
}
function hurtPlayer(dmg,fx,fz){
  if(P.inv>0||S.state!=='play'||S.won)return;
  P.hp-=dmg;P.inv=0.9;P.hurt=0.5;S.shake=0.25;SND.hurt();
  const dx=P.x-fx,dz=P.z-fz,l=Math.hypot(dx,dz)||1;moveBy(P,dx/l*0.6,dz/l*0.6,0.35,P.y,0.35);
  if(P.hp<=0){P.hp=0;S.state='dead';show('dead');unlock();}
}

/* ====================== УПРАВЛЕНИЕ ====================== */
const keys={};const stick={x:0,y:0};let dragLook=false,attackHeld=false;
function lock(){if(isTouch)return;try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{dragLook=true;});}catch(e){dragLook=true;}}
function unlock(){attackHeld=false;try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}}
document.addEventListener('pointerlockerror',()=>{dragLook=true;});
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===canvas)dragLook=false;
  else if(S.state==='play'&&!dragLook&&!isTouch)pause();});
function look(dx,dy,k){P.yaw-=dx*k;P.pitch=Math.max(-1.35,Math.min(1.35,P.pitch-dy*k));}
document.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas&&S.state==='play')look(e.movementX,e.movementY,0.0024);});
let drag=null;
canvas.addEventListener('mousedown',e=>{if(S.state!=='play'||e.button!==0)return;
  if(document.pointerLockElement===canvas){attackHeld=true;attack();}
  else{drag={x:e.clientX,y:e.clientY,moved:0};if(!dragLook)lock();}});
addEventListener('mousemove',e=>{if(!drag||document.pointerLockElement===canvas)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  look(dx,dy,0.005);drag.moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;});
addEventListener('mouseup',()=>{attackHeld=false;if(drag&&drag.moved<6&&(dragLook||isTouch))attack();drag=null;});
addEventListener('keydown',e=>{
  const c=e.code;keys[c]=true;
  if(c==='Space'||c.startsWith('Arrow'))e.preventDefault();
  if(c==='Escape'||c==='KeyP'){if(S.state==='play')pause();else if(S.state==='pause')resume();}
  if(S.state!=='play')return;
  if(c==='KeyE'&&!e.repeat)useDoor();
  if(c==='KeyQ')nextWeapon();
  if(c.startsWith('Digit')){const k=ORDER[+c.slice(5)-1];if(k&&usable(k))setWeapon(k);}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;attackHeld=false;});
if(isTouch){
  const st=$('stick'),knob=$('knob');let id=null,cx=0,cy=0;
  const mv=t=>{let dx=t.clientX-cx,dy=t.clientY-cy;const l=Math.hypot(dx,dy),m=46;if(l>m){dx*=m/l;dy*=m/l;}
    knob.style.transform=`translate(${dx}px,${dy}px)`;stick.x=dx/m;stick.y=dy/m;};
  st.addEventListener('touchstart',e=>{const t=e.changedTouches[0];id=t.identifier;const r=st.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;mv(t);e.preventDefault();},{passive:false});
  st.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===id)mv(t);e.preventDefault();},{passive:false});
  const end=e=>{for(const t of e.changedTouches)if(t.identifier===id){id=null;stick.x=stick.y=0;knob.style.transform='';}};
  st.addEventListener('touchend',end);st.addEventListener('touchcancel',end);
  let lid=null,lx=0,ly=0;
  canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(lid===null){lid=t.identifier;lx=t.clientX;ly=t.clientY;}e.preventDefault();},{passive:false});
  canvas.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===lid){if(S.state==='play')look(t.clientX-lx,t.clientY-ly,0.0065);lx=t.clientX;ly=t.clientY;}e.preventDefault();},{passive:false});
  const lend=e=>{for(const t of e.changedTouches)if(t.identifier===lid)lid=null;};
  canvas.addEventListener('touchend',lend);canvas.addEventListener('touchcancel',lend);
  const hold=(el,on,off)=>{el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false});
    ['touchend','touchcancel'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();if(off)off();},{passive:false}));};
  hold($('tHit'),()=>{attackHeld=true;attack();},()=>{attackHeld=false;});
  hold($('tJump'),()=>{keys.Space=true;},()=>{keys.Space=false;});
  hold($('tSwap'),()=>nextWeapon());
  hold($('tDoor'),()=>useDoor());
  hold($('tPause'),()=>pause());
}
function show(id){
  ['menu','pause','dead','win'].forEach(s=>$(s).classList.toggle('hide',s!==id));
  $('hud').classList.toggle('hide',S.state==='menu');
  $('touch').classList.toggle('hide',!(isTouch&&S.state==='play'));
}
function pause(){if(S.state!=='play')return;S.state='pause';show('pause');unlock();}
function resume(){if(S.state!=='pause')return;S.state='play';show(null);lock();}
function toMenu(){S.state='menu';S.fade=0;destroyFloors();goFloor(1);unlock();show('menu');}
function audioOn(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
$('bPlay').onclick=()=>{audioOn();startGame();};
$('bResume').onclick=()=>{audioOn();resume();};
$('bRetry').onclick=()=>retry();
$('bAgain').onclick=()=>startGame();
$('bQuit').onclick=toMenu;$('bQuit2').onclick=toMenu;
$('bLang').onclick=()=>{lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];try{localStorage.setItem('zs2_lang',lang);}catch(e){}applyLang();};

/* ====================== КАДР ====================== */
function updatePlayer(dt){
  let fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y;
  let side=(keys.KeyD?1:0)-(keys.KeyA?1:0)+stick.x;
  if(keys.ArrowLeft)P.yaw+=2.6*dt;if(keys.ArrowRight)P.yaw-=2.6*dt;
  const l=Math.hypot(fwd,side);if(l>1){fwd/=l;side/=l;}
  const sp=(keys.ShiftLeft||keys.ShiftRight||(isTouch&&l>0.98))?6.8:4.4;
  const f=forward(),r=[Math.cos(P.yaw),-Math.sin(P.yaw)];
  moveBy(P,(f[0]*fwd+r[0]*side)*sp*dt,(f[1]*fwd+r[1]*side)*sp*dt,0.35,P.y,0.35);
  for(const e of enemies){if(e.dead>0||e.flying||Math.abs(e.x-P.x)>2||P.y>e.y+e.k.h*0.8)continue;const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),m=e.k.r+0.28;
    if(d<m&&d>1e-4)moveBy(P,dx/d*(m-d)*0.7,dz/d*(m-d)*0.7,0.35,P.y,0.35);}
  const g=groundAt(P.x,P.z,0.35,P.y,0.35);
  if(keys.Space&&P.y<=g+0.02)P.vy=6.4;
  P.vy-=17*dt;P.y+=P.vy*dt;if(P.y<=g){P.y=g;P.vy=0;}
  P.cd=Math.max(0,P.cd-dt);P.inv=Math.max(0,P.inv-dt);P.swing=Math.max(0,P.swing-dt);
  if((attackHeld||keys.KeyJ)&&P.cd<=0)attack();
  if(l>0.05&&P.y<=g+0.02)P.bob+=dt*sp*2;
}
function updateCamera(){
  const sh=S.shake*0.18;
  camera.position.set(P.x+(Math.random()-0.5)*sh,P.y+1.58+Math.sin(P.bob)*0.035+(Math.random()-0.5)*sh,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  const sw=Math.sin(P.swing/0.22*Math.PI),portrait=camera.aspect<1;
  view.position.set((portrait?0.1:0.2)-sw*0.07,-0.17+Math.sin(P.bob)*0.006+sw*0.02,-0.33-sw*0.05);
  view.rotation.set(-sw*1.0,sw*0.45,0);view.scale.setScalar(0.5);
}
function bossHere(){const r=roomAt(P.x,P.z);
  return enemies.find(e=>(e.kind==='boss'||e.kind==='strict')&&e.dead<=0&&e.awake&&r===e.home)||null;}
const MAP_COLORS={stairs:'#96a8b4',support:'#78c878',korean:'#f0b45a',first:'#f082aa',office:'#d23c46',canteen:'#e1a046',cls:'#e1c88c',hall:'#aa82d2',
  teachers:'#64b4dc',english:'#e6a0be',strict:'#968ca0',pe:'#dc8c50',science:'#78d2c3'};
const MAP_MARK={stairs:'▲▼',support:'♥',korean:'한',first:'1',office:'★',canteen:'食',hall:'♪',teachers:'✎',english:'ABC',strict:'A!',pe:'체',science:'H₂O'};
function drawMap(){
  const c=$('map'),g=c.getContext('2d'),W=c.width,H=c.height,L=F.len,k=W/(L+STAIR*2),X=x=>(x+STAIR)*k;
  g.clearRect(0,0,W,H);g.fillStyle='rgba(10,12,34,.75)';g.fillRect(0,0,W,H);
  F.rooms.forEach(r=>{g.fillStyle=MAP_COLORS[r.type];g.fillRect(X(r.x0)+1,4,r.w*k-2,44);
    textFit(g,r.type==='cls'?r.id:MAP_MARK[r.type],X(r.x0+r.w/2),26,r.w*k-4,16,'#1e1e28');});
  g.fillStyle='#96a8b4';g.fillRect(2,50,W-4,22);
  textFit(g,'▲▼',X(-STAIR/2),61,STAIR*k,12,'#1e1e28');textFit(g,'▲▼',X(L+STAIR/2),61,STAIR*k,12,'#1e1e28');
  const key=F.pickups.find(p=>p.kind==='key');
  if(key){g.fillStyle='#fadc3c';g.beginPath();g.arc(X(key.x),40,6,0,7);g.fill();}
  const px=X(P.x),py=P.z<0?4+(1+P.z/DEPTH)*44:52+P.z/CORR*18;
  g.save();g.translate(px,py);g.rotate(-P.yaw);g.fillStyle='#e6283c';g.strokeStyle='#fff';g.lineWidth=2;
  g.beginPath();g.moveTo(0,-9);g.lineTo(6,6);g.lineTo(-6,6);g.closePath();g.fill();g.stroke();g.restore();
}
function hud(dt){
  $('hearts').innerHTML='<span style="color:#e63c50">'+'♥'.repeat(Math.max(0,P.hp))+'</span><span style="color:#5a5a64">'+'♥'.repeat(Math.max(0,P.max-P.hp))+'</span>';
  const w=WEAPONS[P.weapon];$('weapon').textContent=tr(P.weapon)+(w.ammo?'  x'+(P.ammo[P.weapon]||0):'')+(S.hasKey?'  🔑':'');
  const r=roomAt(P.x,P.z);
  $('place').textContent=tr('floor',F.n)+' · '+(r?roomName(r):tr((P.x<-3||P.x>F.len+3||P.z<-0.3)?'stairs':'corridor'));
  const boss=bossHere();
  $('goal').textContent=tr((r&&r.type==='office')?'goalBoss':(S.hasKey?'goalOffice':'goalKey'));
  $('boss').classList.toggle('hide',!boss);
  if(boss){$('bossfill').style.width=Math.max(0,boss.hp/boss.max*100)+'%';$('bossname').textContent=tr(boss.kind==='boss'?'bossName':'strictName');}
  const d=nearDoor();
  $('hint').textContent=d?tr(d.locked&&!S.hasKey?'lockedHint':(d.open?'closeHint':'openHint')):'';
  $('tDoor').classList.toggle('hide',!d);
  if(S.msgT>0){S.msgT-=dt;if(S.msgT<=0)$('msg').textContent='';}
  S.mapT-=dt;if(S.mapT<=0){S.mapT=0.1;drawMap();}
}
function update(dt){
  if(S.state!=='play')return;
  S.time+=dt;
  updateDoors(dt);updatePlayer(dt);checkStairs();
  const r=roomAt(P.x,P.z);
  if(r!==S.lastRoom){S.lastRoom=r;if(r&&r.safe)say('safe');if(r&&r.id==='5-1')say('npc','',4.5);}
  for(const e of [...enemies]){if(Math.abs(e.x-P.x)<34||e.dead>0)updateEnemy(e,dt);if(S.state!=='play')return;}
  updateProjectiles(dt);if(S.state!=='play')return;
  updatePickups(dt);updateParticles(dt);
  if(S.won){S.winT-=dt;if(S.winT<=0){S.state='win';show('win');unlock();}}
}
function render(dt){
  S.shake=Math.max(0,S.shake-dt);P.hurt=Math.max(0,P.hurt-dt);
  if(S.state==='menu'){S.time+=dt;camera.position.set(3+Math.sin(S.time*0.15)*2,2,CORR*0.65);camera.rotation.set(-0.1,-Math.PI/2+Math.sin(S.time*0.11)*0.4,0);}
  else{updateCamera();hud(dt);$('hurt').style.opacity=Math.min(1,P.hurt*1.8);}
  view.visible=S.state!=='menu';
  if(S.fade>0)S.fade=Math.max(0,S.fade-dt*1.4);
  $('fade').style.opacity=Math.min(1,S.fade*1.5);
  const eye=camera.position.x;   // дальние комнаты и враги не рисуются: телефону легче
  F.rooms.forEach(r=>{r.group.visible=r.x0-eye<30&&eye-r.x1<30;});
  F.doors.forEach(d=>{d.mesh.visible=Math.abs(d.x-eye)<34;});
  enemies.forEach(e=>{e.m.g.visible=Math.abs(e.x-eye)<30;});
  renderer.render(scene,camera);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  update(dt);render(dt);requestAnimationFrame(loop);
}
goFloor(1);applyLang();setWeapon('fists');show('menu');requestAnimationFrame(loop);
// для проверки из консоли (и автоматических тестов)
window.ZS={S,P,PLAN,WEAPONS,KINDS,keys,camera,renderer,scene,floors,get floor(){return F;},get enemies(){return enemies;},
  startGame,retry,update,render,attack,useDoor,setWeapon,nextWeapon,damage,hurtPlayer,changeFloor,goFloor,pause,resume,toMenu,
  setLang:l=>{lang=l;applyLang();},T};
</script>
